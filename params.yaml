# Decisions (tunable). All dates are quoted strings; convert with pd.Timestamp in code.
# clean_text redaction patterns are NOT here: they are frozen model input (src/text.py, checksummed).

ingestion:
  max_bad_lines: 10             # log the actual count; fail only above this
  cutoff_date: "2025-06-01"     # rows on or after this are dropped (June 2025 incomplete)

junk_rules:                     # junk rows go to a human, not the model
  redaction_only_chars: '[X/\s]'
  attachment_phrase: "see attach"   # case-insensitive
  attachment_max_len: 30

labels:
  rename_map:                   # CFPB renamed these on 25 Aug 2023. A list of {from, to}, NOT a dict:
                                # DVC line-wraps long dict KEYS in dvc.lock and corrupts it (values wrap safely)
    - from: "Credit reporting, credit repair services, or other personal consumer reports"
      to: "Credit reporting or other personal consumer reports"
    - from: "Payday loan, title loan, or personal loan"
      to: "Payday loan, title loan, personal loan, or advance loan"
  card_split:                   # old combined product, split by Sub-product
    old_product: "Credit card or prepaid card"
    credit_label: "Credit card"
    prepaid_label: "Prepaid card"
    credit_subproducts:
      - "General-purpose credit card or charge card"
      - "Store credit card"
    prepaid_subproducts:
      - "General-purpose prepaid card"
      - "Government benefit card"
      - "Gift card"
      - "Payroll card"
      - "Student prepaid card"
  # Applied AFTER rename_map, because it matches the NEW credit-reporting name.
  credit_repair_move:
    from_label: "Credit reporting or other personal consumer reports"
    sub_product: "Credit repair services"
    to_label: "Debt or credit management"

split:                          # half-open [start, end): start <= date < end_exclusive
  train_end_exclusive: "2025-01-01"
  val_start: "2025-01-01"
  val_end_exclusive: "2025-03-01"
  test_start: "2025-03-01"
  test_end_exclusive: "2025-06-01"   # = ingestion.cutoff_date
  seed: 42


model_trainer:                  # = notebook 05 Config B (B-none), so it's comparable with the baseline
  tfidf:
    min_df: 5
    ngram_range: [1, 1]         # YAML has no tuples: the builder converts it
    sublinear_tf: true
  logreg:
    max_iter: 1000
    C: 1.0
    class_weight: null          # null in YAML = None in Python

model_evaluation:               # the gate: challenger (new pipeline model) vs champion (deployed), on VALIDATION (test stays the Day 13 one-time report)
  min_macro_f1: 0.65            # absolute floor: champion val is 0.6956, so 0.65 is ~0.045 below (30x the 0.0015 noise); a broken run (wrong labels, wrong clean_text, majority-class ~0.07) lands far under it
  max_macro_f1_drop: 0.005      # challenger >= champion - 0.005: >3x the measured notebook-vs-pipeline noise (0.0015), still catches a real regression
  max_small_class_drop: 0.02    # same rule as Day 12: no small class may lose more than 0.02 F1 vs the champion
  small_classes:                # the same 6 as Day 12, fixed in advance
    - Debt or credit management
    - Prepaid card
    - Payday loan, title loan, personal loan, or advance loan
    - Vehicle loan or lease
    - Student loan
    - Mortgage
  champion:                     # null on a brand-new deployment -> only the floor applies
    tfidf: models/tfidf_b.joblib
    tfidf_sha256: 29a86e481ab54be3598528ee560fb35aa062621d22b482465194ef9cd77f04af
    logreg: models/logreg_b.joblib
    logreg_sha256: 240d83fddbbef138e7d66165728c136a9bd10324add70b1cf739359c60240a1a   # gate refuses to run on a mismatch: never compare against the wrong file
    label_order: models/label_order.json
    label_order_sha256: 8e0f2f852f3dfebfd2b853471d07f51fa264ebbfc670d940943c78d27b89db34
    recorded_val_macro_f1: 0.695574   # measured 2026-11-04 on data/splits/val.parquet; the canary
  max_champion_drift: 0.0001    # frozen champion's score must not move; more = "environment changed" (data / clean_text / library)

serving:                         # read by the API (app/main.py); no DVC stage uses it, so changing it re-runs nothing
  model: bert                    # lr | bert: ONE model per deployment (BERT alone needs ~0.5 GB RAM)
  max_chars: 35000               # raw text above this -> 413 (protects the service; longest real complaint 32,962)
  min_chars: 10                  # after clean_text, below this -> review "too_short", model not called
  thresholds:                    # confidence < threshold -> review. Per model: their probabilities are calibrated differently
    lr: 0.6                      # Day 8, validation
    bert: 0.83                   # Day 19, validation (scripts/bert_threshold.py): matches LR's 14.6% review share
  files:                         # each path is also its key in models/manifest.json: sha256-checked BEFORE loading
    lr:
      tfidf: models/tfidf_b.joblib
      logreg: models/logreg_b.joblib
      label_order: models/label_order.json
    bert:
      onnx: models/bert.onnx
      vocab: models/bert_vocab.txt
      label_order: models/label_order.json
